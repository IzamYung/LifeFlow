<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0f0f0f" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#f5f6fa" media="(prefers-color-scheme: light)">
    <title>UniFlow</title>
    <!-- Leaflet.js Maps CDN -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- CSS Modules -->
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/finance.css">
    <link rel="stylesheet" href="css/schedule.css">
    <link rel="stylesheet" href="css/assignment.css">
    <link rel="stylesheet" href="css/settings.css">
    <!-- PWA Manifest & Icons -->
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="logo.png">
</head>
<body data-theme="dark">
<script>
    (function(){var s=localStorage.getItem('uniflow_theme');if(s==='light'||s==='dark')document.body.setAttribute('data-theme',s);})();
</script>

    <!-- Login screen theme toggle -->
    <label class="login-theme-toggle" id="login-theme-toggle" for="login-dark-mode" title="Toggle theme">
        <svg viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <span>Dark</span>
        <input type="checkbox" id="login-dark-mode" checked style="display:none;">
    </label>

    <!-- =========================================================================
       1. AUTHENTICATION FULLSCREEN OVERLAY
       ========================================================================= -->
    <div id="login-screen">
        <div class="auth-container">
            <div class="auth-header">
                <img src="logo.png" alt="UniFlow" class="auth-logo-img" onerror="this.style.display='none'; document.getElementById('auth-logo-fallback').style.display='flex'">
                <div id="auth-logo-fallback" class="profile-avatar" style="width:72px; height:72px; font-size:24px; font-weight:800; display:none; justify-content:center; align-items:center; border-radius:18px; margin-bottom:4px; background:linear-gradient(135deg, var(--primary), var(--secondary));">UF</div>
                <span class="auth-brand">Uni<span>Flow</span></span>
                <span class="auth-subtitle">Your student life, organized — finance, schedules & more</span>
            </div>

            <!-- Single Login Form: No signup, just profile name verification -->
            <form id="form-auth-login" class="auth-panel active" onsubmit="event.preventDefault();">
                <div class="input-group">
                    <label for="login-username">Profile Name</label>
                    <input type="text" id="login-username" name="username" placeholder="Enter profile name" autocomplete="off" required>
                </div>
                <button type="submit" class="auth-submit-btn">Access Dashboard</button>
            </form>
        </div>
    </div>

    <!-- =========================================================================
       2. MAIN APP SHELL
       ========================================================================= -->
    <div id="app-container" style="display:none;"> <!-- Hidden initially until authenticated -->

        <!-- App Header (Mobile) -->
        <header id="app-header">
            <div class="app-header-left">
                <img src="logo.png" alt="UniFlow" class="app-header-logo" onerror="this.style.display='none'">
                <span class="app-header-brand">Uni<span>Flow</span></span>
            </div>
            <div class="app-header-right">
                <button class="app-header-settings-btn ripple-container" aria-label="Settings" onclick="location.hash='#/settings'">
                    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l-.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                </button>
                <label class="switch switch-mini" title="Toggle dark mode" style="margin:0;">
                    <input type="checkbox" id="global-status-dark-mode">
                    <span class="slider"></span>
                </label>
            </div>
        </header>

        <!-- Application Body Workspace -->
        <div id="app-body">
            <!-- Pull to Refresh Indicator (Mobile Gesture) -->
            <div id="pull-to-refresh" class="ptr-indicator">
                <div class="ptr-spinner">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                        <path d="M23 4v6h-6"/><path d="M1 20v-6h6"/>
                        <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
                    </svg>
                </div>
            </div>
            
            <!-- Sidebar Navigation (Desktop) -->

                    <img src="logo.png" alt="UniFlow" style="width:36px; height:36px; border-radius:10px; object-fit:contain; border:1px solid var(--border-color); background-color:var(--surface-variant); padding:4px;" onerror="this.style.display='none'; document.getElementById('sidebar-logo-fallback').style.display='flex'">

                            <span>Dashboard</span>

                    <li class="sidebar-item" data-page="planner">

                    <li class="sidebar-item" data-page="map">
                        <a href="#/map" class="ripple-container">

                    </li>
                    <li class="sidebar-item" data-page="prayer">
                        <a href="#/prayer" class="ripple-container">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                            <span>Prayer Times</span>
                        </a>
                    </li>
                    <li class="sidebar-item" data-page="vault">
                        <a href="#/vault" class="ripple-container">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
                            <span>Vault</span>
                        </a>
                    </li>
                    <li class="sidebar-item" data-page="settings">
                        <a href="#/settings" class="ripple-container">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                            <span>Settings</span>

                    </li>
                    <li class="sidebar-theme-row">
                        <span class="sidebar-theme-label">Dark Mode</span>
                        <label class="switch switch-mini" style="margin:0;">
                            <input type="checkbox" id="global-sidebar-dark-mode">
                            <span class="slider"></span>
                        </label>
                    </li>
                    <li class="sidebar-item" id="sidebar-logout-item" style="margin-top:auto;">
                        <a href="javascript:void(0)" class="ripple-container" onclick="App.logout()" style="color:var(--error);">

                            <span>Log Out</span>
                        </a>

                </ul>
            </aside>

            <!-- Dynamic SPA Frame -->
            <main id="main-viewport">
                <!-- Rendered dynamically -->
            </main>

        </div>

        <!-- Bottom Navigation Bar (Mobile) -->
        <nav class="bottom-nav">
            <div class="bottom-nav-item active ripple-container" data-page="dashboard">
                <div class="active-pill"></div>
                <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>

            <div class="bottom-nav-item ripple-container" data-page="prayer">
                <div class="active-pill"></div>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>

            </button>
            <div class="fab-menu">

                <button class="fab-mini ripple-container" id="fab-action-schedule" data-tooltip="Add Schedule Event">

                </button>
                <button class="fab-mini ripple-container" id="fab-action-assignment" data-tooltip="Add Assignment">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
                </button>
            </div>
        </div>

        <!-- Overlays dialog box shells -->
        <div class="modal-overlay" id="global-modal-overlay"></div>
        <div class="bottom-sheet" id="global-bottom-sheet">
            <div class="sheet-handle" id="global-sheet-handle"></div>
            <div class="sheet-header">
                <h3 id="sheet-title">Quick Action</h3>
                <div class="sheet-header-actions" style="display: flex; align-items: center; gap: 8px;">

                    </button>
                    <button class="sheet-close ripple-container" id="sheet-close-btn" aria-label="Close modal">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                    </button>
                </div>
            </div>
            <div class="sheet-body" id="sheet-content-area">
                <!-- Dynamic forms -->

    <!-- Application Script Engines -->

    <script src="js/services/api.js"></script>
    <script src="js/components/ripple.js"></script>
    <script src="js/components/modal.js"></script>
    <script src="js/components/forms.js"></script>
    <!-- App Pages -->
    <script src="js/pages/dashboard.js"></script>
    <script src="js/pages/finance.js"></script>
    <script src="js/pages/planner.js"></script>
    <script src="js/pages/map.js"></script>
    <script src="js/pages/prayer.js"></script>
    <script src="js/pages/qibla.js"></script>
    <script src="js/pages/settings.js"></script>
    <script src="js/pages/vault.js"></script>
    <script src="js/app.js"></script>
    <script>
        (function() {
            var KEY = 'uniflow_theme';
            var themeToggles = '#global-status-dark-mode, #global-sidebar-dark-mode, #sett-dark-mode, #login-dark-mode';

            function applyTheme(theme) {
                document.body.setAttribute('data-theme', theme);
                localStorage.setItem(KEY, theme);
                var isDark = theme === 'dark';
                document.querySelectorAll(themeToggles).forEach(function(el) {
                    el.checked = isDark;
                });
                var label = document.querySelector('#login-theme-toggle span');
                if (label) label.textContent = isDark ? 'Dark' : 'Light';
                var meta = document.querySelector('meta[name="theme-color"]:not([media])');
                if (!meta) {
                    meta = document.createElement('meta');
                    meta.name = 'theme-color';
                    document.head.appendChild(meta);
                }
                meta.content = isDark ? '#0f0f0f' : '#f5f6fa';
            }

            var saved = localStorage.getItem(KEY);
            if (saved === 'light' || saved === 'dark') {
                applyTheme(saved);
            } else {
                applyTheme(document.body.getAttribute('data-theme') || 'dark');
            }

            document.body.addEventListener('change', function(e) {
                if (e.target.matches(themeToggles)) {
                    applyTheme(e.target.checked ? 'dark' : 'light');
                }
            });

            new MutationObserver(function() {
                var theme = document.body.getAttribute('data-theme');
                if (theme) localStorage.setItem(KEY, theme);
            }).observe(document.body, { attributes: true, attributeFilter: ['data-theme'] });
        })();
    </script>
</body>
